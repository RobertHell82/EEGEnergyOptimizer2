pause:
  name: Pause
  description: >-
    Steuerung aussetzen. Der Wechselrichter läuft in seiner eigenen
    Eigenverbrauchs-Automatik — die Batterie lädt wie gewohnt aus dem
    PV-Überschuss; danach übernimmt der Fahrplan wieder von selbst. Endet nach
    der angegebenen Dauer oder sobald die Batterie den angegebenen Ladestand
    erreicht hat (mindestens eines von beiden angeben; beides zusammen =
    was zuerst eintritt). Überlebt einen Neustart von Home Assistant.
  fields:
    stunden:
      name: Dauer
      description: >-
        Dauer der Pause in Stunden (0,25 bis 48). Ohne Angabe gilt bei einer
        Pause bis Ladestand die Obergrenze von 48 h als Sicherheitsnetz.
      required: false
      example: 4
      selector:
        number:
          min: 0.25
          max: 48
          step: 0.25
          unit_of_measurement: h
    bis_soc_pct:
      name: Bis Ladestand
      description: >-
        Die Pause endet, sobald die Batterie diesen Ladestand erreicht hat
        (50 bis 100 %). Typischer Fall: „Auto lädt nachher — Batterie soll bis
        dahin voll werden statt in die Gemeinschaft zu entladen."
      required: false
      example: 80
      selector:
        number:
          min: 50
          max: 100
          step: 5
          unit_of_measurement: "%"
    entry_id:
      name: Konfigurationseintrag
      description: Nur nötig, wenn mehrere EEG Energy Optimizer eingerichtet sind.
      required: false
      selector:
        text:

aufheben:
  name: Pause aufheben
  description: Eine laufende Pause sofort beenden.
  fields:
    entry_id:
      name: Konfigurationseintrag
      description: Nur nötig, wenn mehrere EEG Energy Optimizer eingerichtet sind.
      required: false
      selector:
        text:
